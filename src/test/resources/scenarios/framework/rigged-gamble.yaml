name: Rigged Gamble

steps:
  - input:
      gambleResult:
        amount: 0
      submittedBy: RED
      action:
        type: Gamble

    expect:
      primaryActionResult:
        amount: 0

  - input:
      submittedBy: RED
      action:
        type: EndTurn

  - input:
      gambleResult:
        card: TRY_AGAIN
      submittedBy: YELLOW
      action:
        type: Gamble

    expect:
      primaryActionResult:
        card: TRY_AGAIN
