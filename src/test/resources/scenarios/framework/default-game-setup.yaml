name: Default Game Setup

steps:
  - input:
      submittedBy: RED
      action:
        type: SkipPrimary

    expect:
      currentPlayer: RED

      players:
        mode: EXACT
        values:
          - name: Player RED
            color: RED
            money: 100000
            cardCount: 0

          - name: Player YELLOW
            color: YELLOW
            money: 100000
            cardCount: 0

          - name: Player BLUE
            color: BLUE
            money: 100000
            cardCount: 0

          - name: Player GREEN
            color: GREEN
            money: 100000
            cardCount: 0

      pieces:
        mode: CONTAINS
        values:
          - color: RED
            tile: 101
          - color: RED
            tile: 102
          - color: RED
            tile: 103
          - color: RED
            tile: 104

          - color: GREEN
            tile: 401
          - color: GREEN
            tile: 402
          - color: GREEN
            tile: 403
          - color: GREEN
            tile: 404

          - color: BLUE
            tile: 301
          - color: BLUE
            tile: 302
          - color: BLUE
            tile: 303
          - color: BLUE
            tile: 304

          - color: YELLOW
            tile: 201
          - color: YELLOW
            tile: 202
          - color: YELLOW
            tile: 203
          - color: YELLOW
            tile: 204

      properties:
        mode: EXACT
        values: [ ]

      viewerCards:
        mode: EXACT
        values: [ ]

  - input:
      submittedBy: RED
      action:
        type: EndTurn

    expect:
      currentPlayer: YELLOW

  - input:
      submittedBy: YELLOW
      action:
        type: SkipTurn

    expect:
      currentPlayer: BLUE

  - input:
      submittedBy: BLUE
      action:
        type: SkipTurn

    expect:
      currentPlayer: GREEN

  - input:
      submittedBy: GREEN
      action:
        type: SkipTurn

    expect:
      currentPlayer: RED
